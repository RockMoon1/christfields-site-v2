# ── Build ────────────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = ".next"

# Forms email through Resend via the app/api/submit route handler, which the
# Next.js runtime deploys as a function. The one hand-written Netlify Function
# is netlify/functions/tick.mts: a Scheduled Function (@hourly) that POSTs to
# /api/cron/tick with CRON_SECRET so reminders go out and Supabase stays awake.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

# ── Security Headers ──────────────────────────────────────────────────────────
#
# Security headers now live in next.config.ts (async headers()) so they apply
# uniformly to static AND dynamic/SSR responses, including the authenticated
# dashboard. Netlify [[headers]] only reliably cover static/CDN assets, which
# left the Next plugin's function responses (the whole dashboard) unprotected,
# and the old CSP here omitted Clerk/Supabase. Do not re-add headers here, or
# they will conflict with (and double up) the ones from next.config.ts.
