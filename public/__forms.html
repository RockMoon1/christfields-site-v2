<!DOCTYPE html>
<!--
  Netlify Forms detection file. NOT user-facing.

  Required by @netlify/plugin-nextjs v5+ for Netlify Forms to work with Next.js.
  Netlify scans this file at build time to discover which forms the site uses
  and what fields each form has. The actual user-facing forms live in React
  components (see components/sections/JoinForm.tsx). At submission time, Netlify
  routes the POST to the right form based on the form-name hidden input.

  Whenever a new form is added to the site, mirror its field definitions here.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Netlify form detection</title>
  </head>
  <body>

    <!-- ScholarFlow waitlist (home page Join section) -->
    <form
      name="waitlist"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="interest">
        <option value="scholarflow">ScholarFlow</option>
        <option value="faithflow">FaithFlow</option>
        <option value="osint">OSINT and Trace</option>
        <option value="all">Everything</option>
      </select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <!-- FaithFlow Get Involved (faithflow page, Phase 3) -->
    <form
      name="faithflow"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="interest">
        <option value="community">Interested in community</option>
        <option value="future-group">Future group</option>
        <option value="help-start">Help start a group</option>
        <option value="learn-more">Learn more</option>
      </select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

  </body>
</html>
